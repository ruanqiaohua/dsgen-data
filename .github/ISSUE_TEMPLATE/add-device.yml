name: 提交机型
description: 往 dsgen.cn 的机型库里加一台机器
title: "[机型] "
labels: ["机型提交"]
body:
  - type: markdown
    attributes:
      value: |
        填完提交即可，站长审核后会合并进公共库，所有人共用。
        只收录能查到规格的机器——带宽查不到就先别提交，或者注明来源。
  - type: input
    id: name
    attributes:
      label: 机型名称
      description: 写清楚容量，比如「RTX 5080 · 16GB」「MacBook Pro M5 Max · 128GB」
      placeholder: RTX 5080 · 16GB
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 类型
      options:
        - 独显（NVIDIA / AMD）
        - 苹果统一内存
        - 其他
    validations:
      required: true
  - type: input
    id: mem
    attributes:
      label: 内存 / 显存容量（GB）
      placeholder: "16"
    validations:
      required: true
  - type: input
    id: bw
    attributes:
      label: 内存带宽（GB/s）
      description: 这个数决定本地推理速度，最重要。查不到请填「不清楚」
      placeholder: "960"
    validations:
      required: true
  - type: input
    id: price
    attributes:
      label: 参考价格（可选）
      placeholder: "约 ¥8,000"
    validations:
      required: false
  - type: input
    id: source
    attributes:
      label: 规格来源
      description: 一个链接就行，方便核对
      placeholder: https://...
    validations:
      required: false
